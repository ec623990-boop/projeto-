spring.config.import=optional:file:../.env[.properties]

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8091}
server.error.include-message=never
server.error.include-stacktrace=never

app.bridge-api-key=${SENIOR_BRIDGE_API_KEY:}

senior.enabled=${SENIOR_INTEGRATION_ENABLED:false}
senior.base-url=${SENIOR_API_BASE_URL:https://platform.senior.com.br/t/senior.com.br/bridge/1.0/rest/erpx}
senior.auth-url=${SENIOR_AUTH_URL:https://platform.senior.com.br/t/senior.com.br/bridge/1.0/anonymous/rest/platform/authentication/actions/loginWithKey}
senior.tenant-name=${SENIOR_TENANT_NAME:}
senior.access-key=${SENIOR_ACCESS_KEY:}
senior.secret=${SENIOR_SECRET:}
senior.client-id=${SENIOR_CLIENT_ID:}
senior.company-id=${SENIOR_COMPANY_ID:}
